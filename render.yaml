services:
  - type: web
    name: gongkan-public
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # 公开版默认不使用网页用户名/密码。
      # App 第一次只填写服务地址；MCP 仍由独立 token 路径保护。
      - key: MCP_PATH_TOKEN
        sync: false

      # gemini = 原生视频+音轨理解（推荐）
      # openai = 抽帧 + 音频转写的兼容模式
      - key: API_MODE
        sync: false
      - key: API_KEY
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: API_MODEL
        sync: false

      - key: API_FALLBACK_MODEL
        value: ""
      - key: API_AUDIO_MODEL
        value: whisper-1
      - key: GEMINI_AUTH_STYLE
        value: query_key

      - key: MAX_UPLOAD_MB
        value: "80"
      - key: MAX_DURATION_SECONDS
        value: "60"
      - key: GEMINI_INLINE_TARGET_MB
        value: "14"
      - key: OPENAI_FRAME_COUNT
        value: "8"
