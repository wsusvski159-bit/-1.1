services:
  - type: web
    name: gongkan-public
    runtime: docker
    plan: free
    healthCheckPath: /health

    envVars:
      # 新手部署时只需要填写这一项
      - key: MCP_PATH_TOKEN
        sync: false

      # API 由用户在「共看」App 里填写
      - key: API_MODE
        value: gemini

      - key: API_FALLBACK_MODEL
        value: ""

      - key: API_AUDIO_MODEL
        value: whisper-1

      - key: GEMINI_AUTH_STYLE
        value: query_key

      # 视频处理默认设置
      - key: MAX_UPLOAD_MB
        value: "80"

      - key: MAX_DURATION_SECONDS
        value: "60"

      - key: GEMINI_INLINE_TARGET_MB
        value: "14"

      - key: OPENAI_FRAME_COUNT
        value: "8"
